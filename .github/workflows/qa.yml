name: Roadmap QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build FCC curriculum
        run: node scripts/build-fcc-curriculum.mjs

      - name: Sync FCC progress
        run: node scripts/update-fcc-progress.mjs

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: node tests/qa-playwright.mjs
