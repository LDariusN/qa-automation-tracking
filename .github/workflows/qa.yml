name: Roadmap QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build FCC curriculum
        run: node scripts/build-fcc-curriculum.mjs

      - name: Sync FCC progress
        run: node scripts/update-fcc-progress.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run qa

      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-smoke
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
