<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Automation Roadmap</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:35px 20px}.eyebrow{color:#a78bfa;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(34px,5vw,54px);margin:8px 0}.hero p{color:#9aa7c4;line-height:1.6}.progress,.phase{background:#131a2d;border:1px solid #27314d;border-radius:18px;padding:20px;margin:16px 0}.progress{position:sticky;top:12px}.row{display:flex;justify-content:space-between;align-items:center}.bar{height:10px;background:#252e48;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#a78bfa)}.phase h2{margin:0}.meta,small{color:#9aa7c4}.meta{font-size:14px;margin:5px 0 14px}.task{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:13px 0;border-top:1px solid #27314d}.task:first-of-type{border-top:0}input{width:19px;height:19px;accent-color:#8b5cf6}.task strong{display:block}.task small{display:block;line-height:1.5;margin-top:3px}.link{display:inline-block;margin-top:7px;background:#18213a;border:1px solid #27314d;border-radius:9px;padding:6px 9px;color:#c4b5fd;text-decoration:none;font-size:13px}button{background:#18213a;color:#fff;border:1px solid #27314d;border-radius:9px;padding:8px 12px}.footer{text-align:center;color:#9aa7c4;margin:30px}@media(max-width:650px){.progress{position:static}}</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">Personal learning tracker</div><h1>QA Automation Roadmap</h1><p>TypeScript → Playwright → API automation → framework design → SQL → CI/CD → JMeter → Docker/BDD → Java/Selenium.</p><p>Tick tasks as you complete them. Progress is saved in this browser.</p></section><section class="progress"><div class="row"><strong>Overall progress</strong><span id="pct">0%</span><button onclick="resetProgress()">Reset</button></div><div class="bar"><div id="fill" class="fill"></div></div></section><div id="app"></div><div class="footer">QA Automation learning tracker</div></div><script>const P=[['Phase 1 — Programming fundamentals','Weeks 1–3',[['JavaScript fundamentals','Variables, arrays, objects, conditions, loops and functions.','freeCodeCamp','https://www.freecodecamp.org/learn/'],['JavaScript deeper concepts','Array methods, modules, JSON, errors, Promises and async/await.','javascript.info','https://javascript.info/'],['TypeScript basics','Types, interfaces, classes and practical TypeScript for JS developers.','TypeScript Handbook','https://www.typescriptlang.org/docs/handbook/intro.html'],['Practice project','Build a small TypeScript app and commit it to GitHub.','','']]],['Phase 2 — Git & GitHub','Weeks 2–3',[['Git basics','Clone, status, add, commit, push, pull, branches and merge.','GitHub Skills','https://skills.github.com/'],['Portfolio repository','Create your QA-Automation-Framework repository.','GitHub','https://github.com/']]],['Phase 3 — Playwright UI automation','Weeks 4–7',[['Main course','Follow the Playwright JS/TS course from the beginning and code along.','Rahul Shetty — Udemy','https://www.udemy.com/course/playwright-tutorials-automation-testing/'],['UI automation','Locators, actions, assertions, waits, dropdowns, popups, frames and file upload.','Rahul Shetty — Udemy','https://www.udemy.com/course/playwright-tutorials-automation-testing/'],['Debugging','Trace viewer, screenshots, videos, retries and reports.','Playwright Trace Viewer','https://playwright.dev/docs/trace-viewer'],['Page Object Model','Create LoginPage, HomePage, ProductPage and CartPage.','Playwright POM','https://playwright.dev/docs/pom'],['Independent practice','Write 20–30 UI tests without copying the instructor.','','']]],['Phase 4 — API automation','Week 8',[['API automation course','Focus on automated REST/API testing, authentication, validation and reusable API clients.','API Testing Masterclass — Udemy','https://www.udemy.com/course/api-testing-masterclass/'],['Playwright API','Automate API tests with Playwright and connect them to your framework.','Playwright API testing','https://playwright.dev/docs/api-testing'],['Project milestone','Add 10–15 API tests to your framework.','','']]],['Phase 5 — SQL','Week 9',[['Interactive SQL practice','SELECT, WHERE, JOIN, GROUP BY, HAVING, subqueries and aggregates.','SQLBolt','https://sqlbolt.com/'],['Automation integration','Validate data created through UI/API using SQL.','','']]],['Phase 6 — Framework architecture','Weeks 10–11',[['Framework structure','Organize tests, pages, fixtures, API clients, utilities, test data and config.','Playwright fixtures','https://playwright.dev/docs/test-fixtures'],['Build independently','Finish your production-style automation framework and README.','','']]],['Phase 7 — CI/CD','Week 12',[['GitHub Actions','Workflows, jobs, steps, triggers, artifacts, secrets and pull requests.','GitHub Actions','https://docs.github.com/en/actions'],['Playwright CI','Run the suite automatically on pull requests.','Playwright CI','https://playwright.dev/docs/ci'],['Project milestone','CI runs UI/API tests and stores reports/artifacts.','','']]],['Phase 8 — JMeter','Week 13',[['Performance testing','Learn Thread Groups, HTTP requests, assertions, variables, load/stress testing and results.','Apache JMeter','https://jmeter.apache.org/usermanual/get-started.html'],['Practice project','Create a basic 100-user API load test and analyze response time, throughput and errors.','','']]],['Phase 9 — Linux + Docker','Week 14',[['Linux basics','Command line, files, grep, curl, processes, logs and environment variables.','Linux Journey','https://linuxjourney.com/'],['Docker basics','Images, containers, Dockerfiles, ports, volumes and Compose.','Docker workshop','https://docs.docker.com/get-started/workshop/'],['Project milestone','Run your automation environment/tests through Docker.','','']]],['Phase 10 — BDD/Cucumber','Week 14',[['BDD basics','Feature, Scenario, Given/When/Then, Scenario Outline and Examples.','Cucumber','https://cucumber.io/docs/gherkin/reference/'],['Practice','Convert several existing tests into BDD scenarios.','','']]],['Phase 11 — Java + Selenium','Weeks 15–18',[['Java fundamentals','Variables, methods, classes, OOP, interfaces, exceptions and collections.','dev.java','https://dev.java/learn/'],['Selenium','WebDriver, locators, waits, Page Objects and browser automation.','Selenium','https://www.selenium.dev/documentation/'],['JUnit','Lifecycle, assertions and parameterized tests.','JUnit 5','https://docs.junit.org/current/user-guide/'],['Maven','Project structure, dependencies and test execution.','Maven','https://maven.apache.org/guides/getting-started/'],['Final milestone','Build a small Java/Selenium framework.','','']]],['Final — Job-ready portfolio','After the roadmap',[['Polish GitHub','README, architecture, setup instructions, CI badge and sample reports.','',''],['CV update','Add only skills you can demonstrate, plus the portfolio project.','',''],['Interview preparation','Practice automation architecture, locators, waits, API, SQL, Git and CI/CD questions.','',''],['Apply','Start applying once the Playwright/API/Git/CI core is demonstrable.','','']]]];let S=JSON.parse(localStorage.getItem('qaRoadmap')||'{}'),A=document.getElementById('app');P.forEach((p,pi)=>{let s=document.createElement('section');s.className='phase';s.innerHTML='<h2>'+p[0]+'</h2><div class="meta">'+p[1]+'</div>';p[2].forEach((t,ti)=>{let id=pi+'-'+ti,r=document.createElement('div');r.className='task';r.innerHTML='<input type="checkbox" data-id="'+id+'" '+(S[id]?'checked':'')+'><div><strong>'+t[0]+'</strong><small>'+t[1]+'</small>'+(t[2]?'<div><a class="link" target="_blank" rel="noopener" href="'+t[3]+'">'+t[2]+' ↗</a></div>':'')+'</div>';s.appendChild(r)});A.appendChild(s)});function update(){let b=[...document.querySelectorAll('input')],d=b.filter(x=>x.checked).length,p=Math.round(d/b.length*100);document.getElementById('pct').textContent=p+'%';document.getElementById('fill').style.width=p+'%';localStorage.setItem('qaRoadmap',JSON.stringify(Object.fromEntries(b.map(x=>[x.dataset.id,x.checked]))))}document.querySelectorAll('input').forEach(x=>x.onchange=update);function resetProgress(){if(confirm('Reset all progress?')){localStorage.removeItem('qaRoadmap');location.reload()}}update();</script></body></html>
