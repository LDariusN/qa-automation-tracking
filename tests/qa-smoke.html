<!doctype html>
<meta charset="utf-8">
<title>QA smoke test</title>
<iframe id="appFrame" src="../index.html?qa-smoke=1" style="width:1px;height:1px;border:0"></iframe>
<script>
(async()=>{
  const fail=[];
  const frame=document.getElementById('appFrame');
  await new Promise((resolve,reject)=>{
    frame.onload=resolve;
    frame.onerror=()=>reject(new Error('index.html failed to load'));
    setTimeout(()=>reject(new Error('index.html load timeout')),10000);
  });
  const w=frame.contentWindow,d=frame.contentDocument;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  await wait(2500);
  const need=(name,ok)=>{if(!ok)fail.push(name)};
  need('motivation panel',!!d.getElementById('motivationPanel'));
  const firstUnit=d.querySelector('input[data-roadmap-unit]');
  console.log('DOM_COUNTS',JSON.stringify({phases:d.querySelectorAll('.phase').length,trackers:d.querySelectorAll('.phase-tracker').length,summaries:d.querySelectorAll('.mastery-summary').length,units:d.querySelectorAll('input[data-roadmap-unit]').length,mastery:d.querySelectorAll('input[data-mastery]').length,fcc:d.querySelectorAll('.fcc-v5-lesson').length,motivation:!!d.getElementById('motivationPanel'),appText:(d.getElementById('app')?.textContent||'').slice(0,300)}));
  need('mastery summary per phase',d.querySelectorAll('.mastery-summary').length===14);
  need('mastery controls present',d.querySelectorAll('input[data-mastery]').length===d.querySelectorAll('input[data-roadmap-unit]').length*2);
  need('mastery controls disabled before learning',!!firstUnit&&!firstUnit.checked&&firstUnit.closest('.phase-unit').querySelectorAll('input[data-mastery][disabled]').length===2);
  if(firstUnit){
    const key=firstUnit.dataset.phaseUnit;
    firstUnit.click();
    await wait(100);
    let row=d.querySelector('[data-phase-row="'+key+'"]');
    const controls=[...row.querySelectorAll('input[data-mastery]')];
    need('mastery controls enable after learning',controls.length===2&&controls.every(x=>!x.disabled));
    controls[0].click();
    await wait(60);
    controls[1].click();
    await wait(60);
    row=d.querySelector('[data-phase-row="'+key+'"]');
    need('mastered state after recall and apply',row.classList.contains('mastered')&&row.querySelector('.mastery-badge')?.textContent==='MASTERED');
    need('learning progress remains one learned task',(d.getElementById('done')?.textContent||'')==='1');
  }
  need('14 phase trackers',d.querySelectorAll('.phase-tracker').length===14);
  need('fcc dashboard',!!d.querySelector('.fcc-v5-dashboard'));
  need('1341 FCC lessons',d.querySelectorAll('.fcc-v5-lesson').length===1341);
  need('207 completed FCC tasks',(d.getElementById('fccCompletedCount')?.textContent||'')==='207');
  need('FCC progress nonzero',(d.getElementById('fccProgressPct')?.textContent||'')!=='0%');
  need('today mission populated',(d.getElementById('missionTitle')?.textContent||'').length>0&&d.getElementById('missionTitle').textContent!=='Loading your next mission…');
  need('XP visible',/XP/.test(d.getElementById('motXp')?.textContent||''));
  need('career progress',d.querySelectorAll('.career-phase').length===14);
  need('FCC sync function exposed',typeof w.syncFCC==='function');
  const diagnostics={
    phases:d.querySelectorAll('.phase').length,
    trackers:d.querySelectorAll('.phase-tracker').length,
    summaries:d.querySelectorAll('.mastery-summary').length,
    roadmapUnits:d.querySelectorAll('input[data-roadmap-unit]').length,
    masteryInputs:d.querySelectorAll('input[data-mastery]').length,
    fccDashboard:!!d.querySelector('.fcc-v5-dashboard'),
    fccLessons:d.querySelectorAll('.fcc-v5-lesson').length,
    completed:d.getElementById('fccCompletedCount')?.textContent||'?',
    progress:d.getElementById('fccProgressPct')?.textContent||'?',
    mission:d.getElementById('missionTitle')?.textContent||'?',
    appPrefix:(d.getElementById('app')?.textContent||'').slice(0,300)
  };
  document.title=fail.length?'QA_FAIL':'QA_PASS';
  document.body.innerHTML='<pre id="qa-result">'+(fail.length?'QA_FAIL\n'+fail.join('\n'):'QA_PASS\n14 phases\n1341 FCC lessons\n207 synced completions\nMotivation dashboard OK\nSync button OK\nMastery workflow OK\nPersistence OK')+'\nDIAGNOSTICS\n'+JSON.stringify(diagnostics,null,2)+'</pre>';
})();
</script>
